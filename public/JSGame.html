<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Matter.js Game</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            canvas {
                border: 1px solid black;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.17.1/matter.min.js"></script>
    </head>
    <body>
        <script>
            var canvasWidth = 800;
            var canvasHeight = 600;

            // module aliases
            var Engine = Matter.Engine,
                Render = Matter.Render,
                World = Matter.World,
                Bodies = Matter.Bodies;

            // create an engine
            var engine = Engine.create();

            // create a renderer
            var render = Render.create({
                element: document.body,
                engine: engine,
                options: {
                    width: canvasWidth,
                    height: canvasHeight,
                    wireframes: false
                }
            });

            // create two boxes and a ground
            var boxA = Bodies.circle(400, 300, 80, {isStatic: true});
            var boxB = Bodies.rectangle(450, 50, 80, 80);
            var ground = Bodies.rectangle(400, 610, 810, 60, { isStatic: true });


            // function to generate random hilly terrain using rectangles
            function generateHillyTerrain(width, height, segments) {
                var terrainBodies = [];
                var segmentWidth = width / segments;
                var lastHeight = height;

                for (var i = 0; i < segments; i++) {
                    var segmentHeight = height - (Math.random() * height / 2);
                    var x = i * segmentWidth + segmentWidth / 2;
                    var y = (lastHeight + segmentHeight) / 2;
                    var rectangle = Bodies.rectangle(x, y, segmentWidth, Math.abs(lastHeight - segmentHeight), {
                        isStatic: true,
                        render: {
                            fillStyle: 'green'
                        }
                    });
                    terrainBodies.push(rectangle);
                    lastHeight = segmentHeight;
                }

                return terrainBodies;
            }

            // create hilly terrain
            var terrainBodies = generateHillyTerrain(canvasWidth, canvasHeight, 50);


            // add all of the bodies to the world
            World.add(engine.world, [boxA, boxB, ground]);
            World.add(engine.world, terrainBodies);

            // run the engine
            Matter.Runner.run(engine);

            // run the renderer
            Render.run(render);
        </script>
    </body>
</html>
